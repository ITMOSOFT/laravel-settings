
name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: 12
            illuminate: "^12.0"
            testbench: "^10.0"
            phpunit: "^11.0"
          - laravel: 13
            illuminate: "^13.0"
            testbench: "^11.0"
            phpunit: "^12.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install PHP, Composer and extensions
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            php8.3-cli \
            php8.3-mbstring \
            php8.3-sqlite3 \
            php8.3-xml \
            composer \
            unzip

      - name: Verify PHP and Composer
        run: |
          php -v
          composer --version
          php -r 'var_dump(PDO::getAvailableDrivers());'

      - name: Select dependency versions
        run: |
          composer require --no-update \
            "illuminate/support:${{ matrix.illuminate }}"

          composer require --dev --no-update \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "phpunit/phpunit:${{ matrix.phpunit }}"

      - name: Resolve dependencies for this Laravel version
        run: composer update --with-all-dependencies --prefer-dist --no-interaction

      - name: Validate Composer
        run: composer validate --no-check-publish

      - name: Run tests
        run: vendor/bin/phpunit
